<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Generative OS</title>
    <meta name="description" content="A generative desktop OS — every application is a living, recursive AI canvas." />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      *, *::before, *::after { box-sizing: border-box; }

      /* Prevent body scroll — the OS owns the viewport */
      html, body {
        overflow: hidden;
        height: 100%;
        margin: 0;
        padding: 0;
        background: #070b14;
        color: #c9d1d9;
        font-family: 'Inter', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      /* Dark scrollbars for all UI panels */
      ::-webkit-scrollbar { width: 5px; height: 5px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #484f58; }

      /* Generative hover style (injected into iframes separately) */
      .gen-hover {
        outline: 3px solid #388bfd !important;
        outline-offset: -3px;
        cursor: crosshair !important;
        box-shadow: 0 0 16px rgba(56,139,253,0.25) !important;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.35.0",
    "react": "https://esm.sh/react@^19.2.3",
    "react/": "https://esm.sh/react@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "uuid": "https://esm.sh/uuid@^13.0.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root" style="width:100vw;height:100vh;overflow:hidden;"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
