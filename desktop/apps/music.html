<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Music</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0d1117; color: #c9d1d9; font-family: 'Inter', sans-serif; font-size: 13px; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  #main { flex: 1; display: flex; overflow: hidden; }

  /* LEFT SIDEBAR */
  #sidebar { width: 200px; flex-shrink: 0; border-right: 1px solid #21262d; display: flex; flex-direction: column; padding: 0.75rem 0; overflow-y: auto; }
  .sb-section { padding: 0.3rem 0.85rem 0.15rem; font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: #484f58; margin-top: 0.5rem; }
  .sb-item { display: flex; align-items: center; gap: 0.5rem; padding: 0.4rem 0.85rem; cursor: pointer; font-size: 12.5px; color: #8b949e; transition: all 0.12s; border-radius: 0; }
  .sb-item:hover { background: #161b22; color: #c9d1d9; }
  .sb-item.active { color: #e6edf3; background: #1c2128; border-left: 2px solid #388bfd; }
  .sb-item svg { flex-shrink: 0; }

  .playlist-item { display: flex; align-items: center; gap: 0.6rem; padding: 0.4rem 0.5rem 0.4rem 0.85rem; cursor: pointer; border-radius: 0; transition: background 0.12s; }
  .playlist-item:hover { background: #161b22; }
  .playlist-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .playlist-name { font-size: 12px; color: #8b949e; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* CENTER — NOW PLAYING */
  #now-playing { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1.5rem; border-right: 1px solid #21262d; }
  #album-art { width: 180px; height: 180px; border-radius: 16px; margin-bottom: 1.5rem; position: relative; overflow: hidden; flex-shrink: 0; box-shadow: 0 8px 40px rgba(0,0,0,0.6); }
  #album-canvas { width: 100%; height: 100%; display: block; }
  .playing-badge { position: absolute; bottom: 8px; right: 8px; width: 28px; height: 28px; background: rgba(0,0,0,0.7); border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .eq-bar { animation: eq 0.6s ease-in-out infinite alternate; }
  .eq-bar:nth-child(2) { animation-delay: 0.2s; }
  .eq-bar:nth-child(3) { animation-delay: 0.4s; }
  @keyframes eq { from { transform: scaleY(0.3); } to { transform: scaleY(1); } }

  #track-info { text-align: center; margin-bottom: 1.5rem; }
  #track-name { font-size: 1.1rem; font-weight: 700; color: #e6edf3; letter-spacing: -0.02em; margin-bottom: 4px; }
  #track-artist { font-size: 12px; color: #636e7b; }

  #progress-area { width: 100%; max-width: 320px; }
  #progress-bar { width: 100%; height: 4px; background: #21262d; border-radius: 2px; cursor: pointer; position: relative; margin-bottom: 0.4rem; }
  #progress-fill { height: 100%; background: #388bfd; border-radius: 2px; width: 35%; transition: width 0.5s linear; position: relative; }
  #progress-fill::after { content:''; position: absolute; right: -5px; top: -4px; width: 12px; height: 12px; background: #fff; border-radius: 50%; border: 2px solid #388bfd; opacity: 0; transition: opacity 0.15s; }
  #progress-bar:hover #progress-fill::after { opacity: 1; }
  #time-row { display: flex; justify-content: space-between; font-size: 11px; color: #484f58; font-family: 'JetBrains Mono', monospace; }

  #controls { display: flex; align-items: center; gap: 0.75rem; margin-top: 1.25rem; }
  .ctrl-btn { background: none; border: none; color: #8b949e; cursor: pointer; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
  .ctrl-btn:hover { color: #e6edf3; background: #21262d; }
  .ctrl-btn.active { color: #388bfd; }
  #play-btn { background: #388bfd; color: #fff; width: 46px; height: 46px; border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; box-shadow: 0 0 20px rgba(56,139,253,0.4); }
  #play-btn:hover { background: #4f9eff; transform: scale(1.05); }

  #volume-row { display: flex; align-items: center; gap: 0.6rem; margin-top: 0.75rem; width: 100%; max-width: 320px; }
  .vol-icon { color: #636e7b; }
  #vol-bar { flex: 1; height: 3px; background: #21262d; border-radius: 2px; cursor: pointer; }
  #vol-fill { width: 70%; height: 100%; background: #636e7b; border-radius: 2px; transition: background 0.15s; }
  #volume-row:hover #vol-fill { background: #388bfd; }

  /* RIGHT — QUEUE */
  #queue { width: 240px; flex-shrink: 0; display: flex; flex-direction: column; overflow: hidden; }
  #queue-header { padding: 0.75rem 1rem; border-bottom: 1px solid #21262d; font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: #484f58; display: flex; justify-content: space-between; align-items: center; }
  #queue-list { flex: 1; overflow-y: auto; }
  #queue-list::-webkit-scrollbar { width: 3px; }
  #queue-list::-webkit-scrollbar-thumb { background: #30363d; }

  .queue-item { display: flex; align-items: center; gap: 0.6rem; padding: 0.55rem 1rem; cursor: pointer; transition: background 0.12s; border-radius: 0; }
  .queue-item:hover { background: #161b22; }
  .queue-item.playing { background: #1c2128; }
  .track-num { font-size: 11px; color: #484f58; width: 16px; text-align: right; flex-shrink: 0; font-family: 'JetBrains Mono', monospace; }
  .track-num.playing-icon { color: #388bfd; }
  .track-info-mini { flex: 1; overflow: hidden; }
  .track-title-mini { font-size: 12px; color: #c9d1d9; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .track-album-mini { font-size: 11px; color: #636e7b; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .track-dur { font-size: 11px; color: #484f58; font-family: 'JetBrains Mono', monospace; flex-shrink: 0; }
</style>
</head>
<body>

<div id="main">
  <div id="sidebar">
    <div class="sb-section">Library</div>
    <div class="sb-item active">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      Songs
    </div>
    <div class="sb-item">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="1"/></svg>
      Albums
    </div>
    <div class="sb-item">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      Artists
    </div>
    <div class="sb-item">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><heart/><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
      Favourites
    </div>

    <div class="sb-section">Playlists</div>
    <div class="playlist-item"><div class="playlist-dot" style="background:#388bfd"></div><span class="playlist-name">Late Night Coding</span></div>
    <div class="playlist-item"><div class="playlist-dot" style="background:#57ab5a"></div><span class="playlist-name">Morning Focus</span></div>
    <div class="playlist-item"><div class="playlist-dot" style="background:#e3b341"></div><span class="playlist-name">Weekend Chill</span></div>
    <div class="playlist-item"><div class="playlist-dot" style="background:#bc8cff"></div><span class="playlist-name">Deep Work</span></div>
    <div class="playlist-item"><div class="playlist-dot" style="background:#f47067"></div><span class="playlist-name">Workout</span></div>
  </div>

  <div id="now-playing">
    <div id="album-art">
      <canvas id="album-canvas"></canvas>
      <div class="playing-badge">
        <svg width="14" height="14" viewBox="0 0 24 24"><g transform="translate(3,4)"><rect class="eq-bar" x="0" y="4" width="3" height="10" fill="#fff" rx="1" transform-origin="0 14"/><rect class="eq-bar" x="5" y="0" width="3" height="14" fill="#fff" rx="1" transform-origin="5 14"/><rect class="eq-bar" x="10" y="6" width="3" height="8" fill="#fff" rx="1" transform-origin="10 14"/></g></svg>
      </div>
    </div>

    <div id="track-info">
      <div id="track-name">Midnight Algorithms</div>
      <div id="track-artist">Neural Dreams · Late Night Coding</div>
    </div>

    <div id="progress-area">
      <div id="progress-bar">
        <div id="progress-fill"></div>
      </div>
      <div id="time-row">
        <span id="time-current">1:23</span>
        <span id="time-total">3:47</span>
      </div>
    </div>

    <div id="controls">
      <button class="ctrl-btn active" title="Shuffle">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/></svg>
      </button>
      <button class="ctrl-btn" title="Previous">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></svg>
      </button>
      <button id="play-btn" title="Play/Pause">
        <svg id="play-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        <svg id="pause-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
      </button>
      <button class="ctrl-btn" title="Next">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
      </button>
      <button class="ctrl-btn" title="Repeat">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
      </button>
    </div>

    <div id="volume-row">
      <svg class="vol-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/></svg>
      <div id="vol-bar"><div id="vol-fill"></div></div>
      <svg class="vol-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
    </div>
  </div>

  <div id="queue">
    <div id="queue-header">
      <span>Up Next</span>
      <span style="color:#388bfd;cursor:pointer;font-size:11px">Clear</span>
    </div>
    <div id="queue-list"></div>
  </div>
</div>

<script>
(function() {
  const TRACKS = [
    { title:'Midnight Algorithms', artist:'Neural Dreams', album:'CPU Cycles', dur:'3:47', current: true },
    { title:'Gradient Descent', artist:'Backprop', album:'Loss Landscape', dur:'4:12' },
    { title:'Attention Is All You Need', artist:'Transformer', album:'Self-Attention', dur:'5:33' },
    { title:'Recursion Blues', artist:'Stack Overflow', album:'Base Cases', dur:'3:21' },
    { title:'Binary Sunset', artist:'Bit Shift', album:'Two\'s Complement', dur:'4:58' },
    { title:'Kernel Panic', artist:'Root Access', album:'System Calls', dur:'3:15' },
    { title:'Async Dreams', artist:'Promise Chain', album:'Event Loop', dur:'6:02' },
    { title:'Memory Leak', artist:'GC Pause', album:'Heap Walker', dur:'4:44' },
    { title:'Dark Mode', artist:'OLED Dreams', album:'#000000', dur:'3:29' },
    { title:'Latency', artist:'Network Stack', album:'TCP Handshake', dur:'5:17' },
  ];

  let isPlaying = false;
  let progress = 35;
  let currentIdx = 0;

  // Album art canvas
  const canvas = document.getElementById('album-canvas');
  canvas.width = 180; canvas.height = 180;
  const ctx2 = canvas.getContext('2d');
  const PALETTE = ['#1f6feb','#388bfd','#bc8cff','#57ab5a','#e3b341'];
  function drawAlbumArt(idx) {
    ctx2.fillStyle = '#0d1117';
    ctx2.fillRect(0,0,180,180);
    const seed = idx * 7919;
    const rng = (s) => Math.sin(s * seed + 1) * 0.5 + 0.5;
    for (let i = 0; i < 8; i++) {
      const x = rng(i*3) * 180, y = rng(i*3+1) * 180, r = rng(i*3+2) * 90 + 20;
      const grad = ctx2.createRadialGradient(x,y,0,x,y,r);
      const col = PALETTE[Math.floor(rng(i) * PALETTE.length)];
      grad.addColorStop(0, col + '66');
      grad.addColorStop(1, 'transparent');
      ctx2.fillStyle = grad;
      ctx2.fillRect(0,0,180,180);
    }
  }
  drawAlbumArt(0);

  // Render queue
  const queueList = document.getElementById('queue-list');
  function renderQueue() {
    queueList.innerHTML = '';
    TRACKS.forEach((t, i) => {
      const div = document.createElement('div');
      div.className = 'queue-item' + (i === currentIdx ? ' playing' : '');
      div.innerHTML = `
        <div class="track-num ${i === currentIdx ? 'playing-icon' : ''}">${i === currentIdx ? '▶' : i+1}</div>
        <div class="track-info-mini">
          <div class="track-title-mini">${t.title}</div>
          <div class="track-album-mini">${t.artist}</div>
        </div>
        <div class="track-dur">${t.dur}</div>`;
      div.addEventListener('click', () => { currentIdx = i; loadTrack(); renderQueue(); });
      queueList.appendChild(div);
    });
  }

  function loadTrack() {
    const t = TRACKS[currentIdx];
    document.getElementById('track-name').textContent = t.title;
    document.getElementById('track-artist').textContent = `${t.artist} · Late Night Coding`;
    document.getElementById('time-total').textContent = t.dur;
    progress = 0;
    document.getElementById('progress-fill').style.width = '0%';
    document.getElementById('time-current').textContent = '0:00';
    drawAlbumArt(currentIdx);
    if (isPlaying) startProgress();
  }

  let timer = null;
  function startProgress() {
    clearInterval(timer);
    timer = setInterval(() => {
      progress = Math.min(100, progress + 0.2);
      document.getElementById('progress-fill').style.width = progress + '%';
      const total = TRACKS[currentIdx].dur.split(':').map(Number);
      const totalSec = total[0]*60 + total[1];
      const curSec = Math.floor(totalSec * progress / 100);
      const m = Math.floor(curSec/60), s = curSec % 60;
      document.getElementById('time-current').textContent = `${m}:${String(s).padStart(2,'0')}`;
      if (progress >= 100) { clearInterval(timer); if (currentIdx < TRACKS.length-1) { currentIdx++; loadTrack(); renderQueue(); startProgress(); } }
    }, 100);
  }

  document.getElementById('play-btn').addEventListener('click', () => {
    isPlaying = !isPlaying;
    document.getElementById('play-icon').style.display = isPlaying ? 'none' : 'block';
    document.getElementById('pause-icon').style.display = isPlaying ? 'block' : 'none';
    if (isPlaying) startProgress(); else clearInterval(timer);
  });

  document.getElementById('progress-bar').addEventListener('click', e => {
    const rect = e.currentTarget.getBoundingClientRect();
    progress = ((e.clientX - rect.left) / rect.width) * 100;
    document.getElementById('progress-fill').style.width = progress + '%';
  });

  document.getElementById('vol-bar').addEventListener('click', e => {
    const rect = e.currentTarget.getBoundingClientRect();
    const v = ((e.clientX - rect.left) / rect.width) * 100;
    document.getElementById('vol-fill').style.width = v + '%';
  });

  renderQueue();
  document.getElementById('progress-fill').style.width = progress + '%';
})();
</script>
</body>
</html>
