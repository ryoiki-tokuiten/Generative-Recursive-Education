<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Calculator</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0d1117; color: #c9d1d9; font-family: 'Inter', sans-serif; height: 100vh; display: flex; overflow: hidden; }

  /* MAIN CALC */
  #calc { flex: 1; display: flex; flex-direction: column; }

  /* MODE TABS */
  #mode-bar { display: flex; gap: 2px; padding: 0.5rem 0.65rem 0; flex-shrink: 0; }
  .mode-tab { font-size: 11px; padding: 0.25rem 0.65rem; border-radius: 5px; cursor: pointer; color: #636e7b; transition: all 0.15s; font-family: inherit; background: none; border: none; }
  .mode-tab.active { background: #21262d; color: #e6edf3; }
  .mode-tab:hover { color: #c9d1d9; }

  /* DISPLAY */
  #display {
    padding: 0.75rem 1rem 0.5rem; flex-shrink: 0; min-height: 100px;
    display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-end;
    border-bottom: 1px solid #161b22;
  }
  #expr { font-size: 13px; color: #484f58; font-family: 'JetBrains Mono', monospace; min-height: 20px; text-align: right; word-break: break-all; }
  #result { font-size: 2.2rem; font-weight: 300; color: #e6edf3; font-family: 'JetBrains Mono', monospace; letter-spacing: -0.02em; text-align: right; word-break: break-all; }
  #result.error { color: #f47067; font-size: 1.2rem; }

  /* KEYPAD */
  #keypad { flex: 1; display: grid; padding: 0.4rem; gap: 0.3rem; }
  #keypad.standard { grid-template-columns: repeat(4, 1fr); }
  #keypad.scientific { grid-template-columns: repeat(5, 1fr); }

  .key {
    background: #161b22; border: 1px solid #1c2128; color: #c9d1d9;
    border-radius: 8px; cursor: pointer; font-size: 14px; font-family: 'JetBrains Mono', monospace;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.1s, transform 0.1s; user-select: none;
    min-height: 0;
  }
  .key:hover { background: #21262d; }
  .key:active { transform: scale(0.94); background: #2d333b; }
  .key.op { background: #1c2a3a; color: #388bfd; border-color: #1f3050; }
  .key.op:hover { background: #213244; }
  .key.eq { background: #1f6feb; color: #fff; border-color: #1a5ec4; font-size: 18px; }
  .key.eq:hover { background: #388bfd; }
  .key.clear { color: #f47067; }
  .key.fn { background: #1c2128; color: #8b949e; font-size: 11px; }
  .key.fn:hover { background: #21262d; color: #c9d1d9; }
  .key.zero { grid-column: span 2; }

  /* HISTORY */
  #history-pane { width: 200px; flex-shrink: 0; border-left: 1px solid #21262d; display: flex; flex-direction: column; }
  #hist-header { padding: 0.6rem 0.75rem; border-bottom: 1px solid #21262d; font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: #484f58; display: flex; justify-content: space-between; align-items: center; font-family: 'JetBrains Mono', monospace; }
  #hist-clear { background: none; border: none; color: #484f58; cursor: pointer; font-size: 11px; font-family: inherit; transition: color 0.15s; }
  #hist-clear:hover { color: #f47067; }
  #hist-list { flex: 1; overflow-y: auto; padding: 0.4rem 0; }
  #hist-list::-webkit-scrollbar { width: 3px; }
  #hist-list::-webkit-scrollbar-thumb { background: #30363d; }
  .hist-item { padding: 0.5rem 0.75rem; cursor: pointer; border-radius: 0; transition: background 0.12s; }
  .hist-item:hover { background: #161b22; }
  .hist-expr { font-size: 11px; color: #636e7b; font-family: 'JetBrains Mono', monospace; word-break: break-all; }
  .hist-result { font-size: 14px; color: #e6edf3; font-family: 'JetBrains Mono', monospace; font-weight: 500; text-align: right; }
</style>
</head>
<body>

<div id="calc">
  <div id="mode-bar">
    <button class="mode-tab active" id="tab-std" onclick="setMode('standard')">Standard</button>
    <button class="mode-tab" id="tab-sci" onclick="setMode('scientific')">Scientific</button>
  </div>
  <div id="display">
    <div id="expr"></div>
    <div id="result">0</div>
  </div>
  <div id="keypad" class="standard">
    <!-- rendered by JS -->
  </div>
</div>

<div id="history-pane">
  <div id="hist-header">
    <span>History</span>
    <button id="hist-clear" onclick="clearHist()">Clear</button>
  </div>
  <div id="hist-list"></div>
</div>

<script>
(function() {
  let expr = '';
  let resultEl = document.getElementById('result');
  let exprEl = document.getElementById('expr');
  let mode = 'standard';
  let history = [];

  const STD_KEYS = [
    { label:'AC', cls:'clear', action:'clear' }, { label:'±', cls:'fn', action:'negate' }, { label:'%', cls:'fn', action:'percent' }, { label:'÷', cls:'op', action:'op', val:'/' },
    { label:'7', action:'digit', val:'7' }, { label:'8', action:'digit', val:'8' }, { label:'9', action:'digit', val:'9' }, { label:'×', cls:'op', action:'op', val:'*' },
    { label:'4', action:'digit', val:'4' }, { label:'5', action:'digit', val:'5' }, { label:'6', action:'digit', val:'6' }, { label:'−', cls:'op', action:'op', val:'-' },
    { label:'1', action:'digit', val:'1' }, { label:'2', action:'digit', val:'2' }, { label:'3', action:'digit', val:'3' }, { label:'+', cls:'op', action:'op', val:'+' },
    { label:'0', cls:'zero', action:'digit', val:'0' }, { label:'.', action:'dot' }, { label:'=', cls:'eq', action:'equals' },
  ];

  const SCI_KEYS = [
    { label:'sin', cls:'fn', action:'fn', val:'Math.sin' }, { label:'cos', cls:'fn', action:'fn', val:'Math.cos' }, { label:'tan', cls:'fn', action:'fn', val:'Math.tan' }, { label:'ln', cls:'fn', action:'fn', val:'Math.log' }, { label:'log', cls:'fn', action:'fn', val:'Math.log10' },
    { label:'x²', cls:'fn', action:'fn', val:'**2' }, { label:'x³', cls:'fn', action:'fn', val:'**3' }, { label:'√', cls:'fn', action:'fn', val:'Math.sqrt' }, { label:'π', cls:'fn', action:'const', val:String(Math.PI) }, { label:'e', cls:'fn', action:'const', val:String(Math.E) },
    { label:'AC', cls:'clear', action:'clear' }, { label:'±', cls:'fn', action:'negate' }, { label:'%', cls:'fn', action:'percent' }, { label:'(', cls:'fn', action:'digit', val:'(' }, { label:')', cls:'fn', action:'digit', val:')' },
    { label:'7', action:'digit', val:'7' }, { label:'8', action:'digit', val:'8' }, { label:'9', action:'digit', val:'9' }, { label:'⌫', cls:'fn', action:'back' }, { label:'÷', cls:'op', action:'op', val:'/' },
    { label:'4', action:'digit', val:'4' }, { label:'5', action:'digit', val:'5' }, { label:'6', action:'digit', val:'6' }, { label:'+', cls:'op', action:'op', val:'+' }, { label:'×', cls:'op', action:'op', val:'*' },
    { label:'1', action:'digit', val:'1' }, { label:'2', action:'digit', val:'2' }, { label:'3', action:'digit', val:'3' }, { label:'−', cls:'op', action:'op', val:'-' }, { label:'=', cls:'eq', action:'equals' },
    { label:'0', cls:'zero', action:'digit', val:'0' }, { label:'.', action:'dot' },
  ];

  function renderKeys(keys) {
    const pad = document.getElementById('keypad');
    pad.innerHTML = '';
    keys.forEach(k => {
      const btn = document.createElement('button');
      btn.className = 'key' + (k.cls ? ' ' + k.cls : '');
      btn.textContent = k.label;
      btn.addEventListener('click', () => handle(k));
      pad.appendChild(btn);
    });
  }

  window.setMode = function(m) {
    mode = m;
    document.getElementById('tab-std').classList.toggle('active', m === 'standard');
    document.getElementById('tab-sci').classList.toggle('active', m === 'scientific');
    const pad = document.getElementById('keypad');
    pad.className = 'keypad ' + (m === 'standard' ? 'standard' : 'scientific');
    pad.id = 'keypad';
    renderKeys(m === 'standard' ? STD_KEYS : SCI_KEYS);
  };

  function display(val) {
    resultEl.textContent = val;
    resultEl.className = '';
  }
  function displayError(msg) {
    resultEl.textContent = msg;
    resultEl.className = 'error';
  }

  function handle(k) {
    switch (k.action) {
      case 'digit': expr += k.val; break;
      case 'op': expr += ` ${k.val} `; break;
      case 'dot': if (!expr.split(/[+\-*/]/).pop().includes('.')) expr += '.'; break;
      case 'clear': expr = ''; display('0'); exprEl.textContent = ''; return;
      case 'back': expr = expr.slice(0,-1); break;
      case 'negate': if (expr) expr = `-(${expr})`; break;
      case 'percent': if (expr) expr = `(${expr})/100`; break;
      case 'fn':
        if (k.val.startsWith('Math.')) expr = `${k.val}(${expr || 0})`;
        else expr = `(${expr || 0})${k.val}`;
        break;
      case 'const': expr += k.val; break;
      case 'equals': evaluate(); return;
    }
    try {
      const r = Function(`'use strict'; return (${expr.trim() || 0})`)();
      if (isFinite(r)) display(parseFloat(r.toPrecision(12)).toString());
      else display('...');
    } catch { display(expr || '0'); }
    exprEl.textContent = expr;
  }

  function evaluate() {
    const raw = expr.trim();
    if (!raw) { display('0'); return; }
    try {
      const r = Function(`'use strict'; return (${raw})`)();
      if (!isFinite(r)) { displayError('Math Error'); return; }
      const result = parseFloat(r.toPrecision(12)).toString();
      history.unshift({ expr: raw, result });
      if (history.length > 50) history.pop();
      renderHistory();
      exprEl.textContent = raw + ' =';
      display(result);
      expr = result;
    } catch { displayError('Syntax Error'); }
  }

  function renderHistory() {
    const list = document.getElementById('hist-list');
    list.innerHTML = '';
    history.forEach(h => {
      const div = document.createElement('div');
      div.className = 'hist-item';
      div.innerHTML = `<div class="hist-expr">${h.expr.replace(/</g,'&lt;')}</div><div class="hist-result">${h.result}</div>`;
      div.addEventListener('click', () => { expr = h.result; display(h.result); exprEl.textContent = h.expr + ' ='; });
      list.appendChild(div);
    });
  }

  window.clearHist = function() { history = []; renderHistory(); };

  document.addEventListener('keydown', e => {
    if (e.key >= '0' && e.key <= '9') handle({action:'digit',val:e.key});
    else if (e.key === '.') handle({action:'dot'});
    else if (e.key === '+') handle({action:'op',val:'+'});
    else if (e.key === '-') handle({action:'op',val:'-'});
    else if (e.key === '*') handle({action:'op',val:'*'});
    else if (e.key === '/') { e.preventDefault(); handle({action:'op',val:'/'}); }
    else if (e.key === 'Enter' || e.key === '=') evaluate();
    else if (e.key === 'Backspace') handle({action:'back'});
    else if (e.key === 'Escape') handle({action:'clear'});
    else if (e.key === '(' || e.key === ')') handle({action:'digit',val:e.key});
  });

  setMode('standard');
})();
</script>
</body>
</html>
