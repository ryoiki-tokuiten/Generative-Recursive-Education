<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Files</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0d1117; color: #c9d1d9; font-family: 'Inter', sans-serif; font-size: 13px; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  #toolbar {
    display: flex; align-items: center; gap: 0.4rem; padding: 0.5rem 0.75rem;
    border-bottom: 1px solid #21262d; background: #161b22; flex-shrink: 0;
  }
  .nav-btn { background: none; border: none; color: #636e7b; cursor: pointer; width: 28px; height: 28px; border-radius: 6px; display: flex; align-items: center; justify-content: center; transition: background 0.15s, color 0.15s; }
  .nav-btn:hover { background: #21262d; color: #c9d1d9; }
  #breadcrumb { flex: 1; display: flex; align-items: center; gap: 0.25rem; font-size: 12px; color: #8b949e; }
  .bc-item { cursor: pointer; padding: 0.15rem 0.35rem; border-radius: 4px; transition: background 0.15s; }
  .bc-item:hover { background: #21262d; color: #c9d1d9; }
  .bc-sep { color: #484f58; }
  #search-bar { background: #21262d; border: 1px solid #30363d; color: #c9d1d9; border-radius: 6px; padding: 0.3rem 0.6rem; font-size: 12px; font-family: inherit; outline: none; width: 180px; transition: border-color 0.2s; }
  #search-bar:focus { border-color: #388bfd; }
  #search-bar::placeholder { color: #484f58; }
  .view-btn { background: none; border: none; color: #636e7b; cursor: pointer; padding: 0.3rem; border-radius: 4px; transition: all 0.15s; }
  .view-btn.active { color: #388bfd; background: #1f6feb22; }
  .view-btn:hover { color: #c9d1d9; }

  #main { flex: 1; display: flex; overflow: hidden; }

  /* SIDEBAR */
  #sidebar { width: 180px; flex-shrink: 0; border-right: 1px solid #21262d; padding: 0.75rem 0; overflow-y: auto; }
  .sb-section { padding: 0.25rem 0.75rem 0.1rem; font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: #484f58; margin-top: 0.5rem; }
  .sb-item { display: flex; align-items: center; gap: 0.5rem; padding: 0.4rem 0.75rem; cursor: pointer; border-radius: 0; transition: background 0.12s; font-size: 12.5px; color: #8b949e; }
  .sb-item:hover { background: #161b22; color: #c9d1d9; }
  .sb-item.active { background: #1c2128; color: #e6edf3; border-left: 2px solid #388bfd; }
  .sb-icon { width: 16px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

  /* CONTENT */
  #content { flex: 1; overflow-y: auto; padding: 1rem; }
  #content::-webkit-scrollbar { width: 4px; }
  #content::-webkit-scrollbar-thumb { background: #30363d; }

  /* STATUS BAR */
  #status-bar { background: #161b22; border-top: 1px solid #21262d; padding: 0.3rem 0.75rem; font-size: 11px; color: #484f58; font-family: 'JetBrains Mono', monospace; display: flex; gap: 1.5rem; flex-shrink: 0; }

  /* GRID VIEW */
  .file-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 0.5rem; }
  .file-card {
    background: #161b22; border: 1px solid #21262d; border-radius: 8px;
    padding: 0.85rem 0.5rem 0.65rem; display: flex; flex-direction: column; align-items: center; gap: 0.4rem;
    cursor: pointer; transition: background 0.12s, border-color 0.12s; user-select: none;
  }
  .file-card:hover { background: #1c2128; border-color: #30363d; }
  .file-card.selected { background: #1f2a3a; border-color: #388bfd; }
  .file-icon { font-size: 28px; line-height: 1; }
  .file-name { font-size: 11px; color: #c9d1d9; text-align: center; word-break: break-word; line-height: 1.3; }
  .file-size { font-size: 10px; color: #484f58; }

  /* LIST VIEW */
  .file-list { display: flex; flex-direction: column; }
  .list-header { display: grid; grid-template-columns: 1fr auto auto auto; gap: 1rem; padding: 0.4rem 0.75rem; border-bottom: 1px solid #21262d; font-size: 11px; color: #484f58; margin-bottom: 0.25rem; }
  .list-item { display: grid; grid-template-columns: 1fr auto auto auto; gap: 1rem; padding: 0.45rem 0.75rem; border-radius: 6px; cursor: pointer; align-items: center; transition: background 0.12s; }
  .list-item:hover { background: #161b22; }
  .list-item.selected { background: #1f2a3a; }
  .li-name { display: flex; align-items: center; gap: 0.5rem; font-size: 12.5px; }
  .li-icon { font-size: 16px; }
  .li-size, .li-type, .li-date { font-size: 11px; color: #636e7b; text-align: right; white-space: nowrap; }

  /* CONTEXT MENU */
  #ctx-menu { position: fixed; background: #21262d; border: 1px solid #30363d; border-radius: 8px; padding: 0.35rem; z-index: 999; display: none; box-shadow: 0 4px 20px rgba(0,0,0,0.5); min-width: 160px; }
  #ctx-menu.show { display: block; }
  .ctx-item { padding: 0.4rem 0.75rem; border-radius: 5px; cursor: pointer; font-size: 12px; color: #c9d1d9; transition: background 0.12s; }
  .ctx-item:hover { background: #388bfd22; color: #388bfd; }
  .ctx-sep { height: 1px; background: #30363d; margin: 0.25rem 0; }
  .ctx-item.danger:hover { background: #f4706722; color: #f47067; }
</style>
</head>
<body>

<div id="toolbar">
  <button class="nav-btn" id="btn-back" title="Back">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <button class="nav-btn" id="btn-fwd" title="Forward" disabled>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg>
  </button>
  <button class="nav-btn" id="btn-up" title="Parent folder">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
  </button>
  <div id="breadcrumb"></div>
  <input type="text" id="search-bar" placeholder="Search…" />
  <button class="view-btn active" id="btn-grid" title="Grid view">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
  </button>
  <button class="view-btn" id="btn-list" title="List view">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
  </button>
</div>

<div id="main">
  <div id="sidebar">
    <div class="sb-section">Bookmarks</div>
    <div class="sb-item active" data-path="/home/user">
      <span class="sb-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#57ab5a" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span> Home
    </div>
    <div class="sb-item" data-path="/home/user/Documents">
      <span class="sb-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#539bf5" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg></span> Documents
    </div>
    <div class="sb-item" data-path="/home/user/Downloads">
      <span class="sb-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#e3b341" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></span> Downloads
    </div>
    <div class="sb-item" data-path="/tmp">
      <span class="sb-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#bc8cff" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg></span> Trash
    </div>
    <div class="sb-section">Devices</div>
    <div class="sb-item" data-path="/">
      <span class="sb-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#96d0ff" stroke-width="2"><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></svg></span> Root
    </div>
  </div>

  <div id="content"></div>
</div>

<div id="status-bar">
  <span id="status-count">0 items</span>
  <span id="status-selected"></span>
  <span id="status-size"></span>
</div>

<div id="ctx-menu">
  <div class="ctx-item">Open</div>
  <div class="ctx-item">Open With…</div>
  <div class="ctx-sep"></div>
  <div class="ctx-item">Copy</div>
  <div class="ctx-item">Cut</div>
  <div class="ctx-item">Paste</div>
  <div class="ctx-sep"></div>
  <div class="ctx-item">Rename</div>
  <div class="ctx-item">Get Info</div>
  <div class="ctx-sep"></div>
  <div class="ctx-item danger">Move to Trash</div>
</div>

<script>
(function() {
  const FS = {
    '/': { type:'dir', children: { home:{type:'dir'}, etc:{type:'dir'}, usr:{type:'dir'}, tmp:{type:'dir'}, var:{type:'dir'} } },
    '/home': { type:'dir', children: { user:{type:'dir'} } },
    '/home/user': { type:'dir', children: {
      Documents:{type:'dir'}, Downloads:{type:'dir'}, Desktop:{type:'dir'},
      Pictures:{type:'dir'}, Videos:{type:'dir'}, Music:{type:'dir'},
      '.bashrc':{type:'file',size:'3.2 KB',ext:'sh',date:'Apr 20'}, '.config':{type:'dir'},
      'README.md':{type:'file',size:'1.1 KB',ext:'md',date:'Apr 19'},
    }},
    '/home/user/Documents': { type:'dir', children: {
      'notes.md':{type:'file',size:'4.2 KB',ext:'md',date:'Apr 20'},
      'projects.txt':{type:'file',size:'0.8 KB',ext:'txt',date:'Apr 18'},
      'architecture.pdf':{type:'file',size:'2.3 MB',ext:'pdf',date:'Apr 15'},
      'report_q1.docx':{type:'file',size:'1.7 MB',ext:'docx',date:'Mar 31'},
      'Budget':{type:'dir'}, 'Work':{type:'dir'},
    }},
    '/home/user/Downloads': { type:'dir', children: {
      'setup.sh':{type:'file',size:'1.2 KB',ext:'sh',date:'Apr 19'},
      'archive.zip':{type:'file',size:'45.3 MB',ext:'zip',date:'Apr 14'},
      'wallpaper.jpg':{type:'file',size:'3.8 MB',ext:'jpg',date:'Apr 12'},
      'node-v20.tar.gz':{type:'file',size:'28.1 MB',ext:'gz',date:'Apr 10'},
    }},
    '/tmp': { type:'dir', children: { 'tmp-cache':{type:'dir'} } },
  };

  const ICONS = { dir:'📁', md:'📝', txt:'📄', pdf:'📕', docx:'📃', sh:'⚙️', zip:'📦', jpg:'🖼️', png:'🖼️', mp3:'🎵', mp4:'🎬', gz:'📦', default:'📄' };

  let currentPath = '/home/user';
  let viewMode = 'grid';
  let history = ['/home/user'];
  let histIdx = 0;
  let selected = new Set();

  const contentEl = document.getElementById('content');
  const statusCount = document.getElementById('status-count');
  const statusSelected = document.getElementById('status-selected');
  const ctxMenu = document.getElementById('ctx-menu');

  function getNode(path) {
    return FS[path] || null;
  }

  function renderCurrent() {
    const node = getNode(currentPath);
    selected.clear();
    renderBreadcrumb();
    updateSidebar();

    if (!node || node.type !== 'dir') { contentEl.innerHTML = '<p style="color:#484f58;padding:2rem">No content</p>'; return; }
    const entries = Object.entries(node.children);
    const filtered = entries; // could add search filter here
    statusCount.textContent = `${filtered.length} item${filtered.length !== 1 ? 's' : ''}`;
    statusSelected.textContent = '';

    if (viewMode === 'grid') renderGrid(filtered);
    else renderList(filtered);
  }

  function renderGrid(entries) {
    contentEl.innerHTML = '';
    const grid = document.createElement('div');
    grid.className = 'file-grid';
    entries.forEach(([name, info]) => {
      const ext = name.split('.').pop() || 'default';
      const icon = info.type === 'dir' ? ICONS.dir : (ICONS[ext] || ICONS.default);
      const card = document.createElement('div');
      card.className = 'file-card';
      card.innerHTML = `<div class="file-icon">${icon}</div><div class="file-name">${name}</div>${info.size ? `<div class="file-size">${info.size}</div>` : ''}`;
      card.addEventListener('click', e => {
        e.stopPropagation();
        selected.clear(); selected.add(name);
        grid.querySelectorAll('.file-card').forEach(c => c.classList.remove('selected'));
        card.classList.add('selected');
        statusSelected.textContent = `"${name}" selected`;
      });
      card.addEventListener('dblclick', () => {
        if (info.type === 'dir') navigate(currentPath === '/' ? '/' + name : currentPath + '/' + name);
      });
      card.addEventListener('contextmenu', e => { e.preventDefault(); showCtxMenu(e, name, info); });
      grid.appendChild(card);
    });
    contentEl.appendChild(grid);
  }

  function renderList(entries) {
    contentEl.innerHTML = '';
    const container = document.createElement('div');
    container.className = 'file-list';
    container.innerHTML = `<div class="list-header"><span>Name</span><span>Kind</span><span style="min-width:70px">Size</span><span style="min-width:80px">Modified</span></div>`;
    entries.forEach(([name, info]) => {
      const ext = name.split('.').pop() || '';
      const icon = info.type === 'dir' ? ICONS.dir : (ICONS[ext] || ICONS.default);
      const row = document.createElement('div');
      row.className = 'list-item';
      row.innerHTML = `<div class="li-name"><span class="li-icon">${icon}</span>${name}</div><div class="li-type">${info.type === 'dir' ? 'Folder' : (ext.toUpperCase() || 'File')}</div><div class="li-size">${info.size || '—'}</div><div class="li-date">${info.date || '—'}</div>`;
      row.addEventListener('click', e => {
        e.stopPropagation();
        selected.clear(); selected.add(name);
        container.querySelectorAll('.list-item').forEach(r => r.classList.remove('selected'));
        row.classList.add('selected');
        statusSelected.textContent = `"${name}" selected`;
      });
      row.addEventListener('dblclick', () => {
        if (info.type === 'dir') navigate(currentPath === '/' ? '/' + name : currentPath + '/' + name);
      });
      container.appendChild(row);
    });
    contentEl.appendChild(container);
  }

  function navigate(path) {
    if (!FS[path]) { FS[path] = { type:'dir', children:{} }; }
    history.splice(histIdx+1);
    history.push(path);
    histIdx = history.length-1;
    currentPath = path;
    renderCurrent();
    document.getElementById('btn-back').disabled = histIdx === 0;
    document.getElementById('btn-fwd').disabled = true;
  }

  function renderBreadcrumb() {
    const bc = document.getElementById('breadcrumb');
    const parts = currentPath === '/' ? [''] : currentPath.split('/');
    bc.innerHTML = '';
    let built = '';
    parts.forEach((p, i) => {
      const path = p === '' ? '/' : (built += '/' + p, built);
      const span = document.createElement('span');
      span.className = 'bc-item';
      span.textContent = p || 'Root';
      span.addEventListener('click', () => navigate(path));
      bc.appendChild(span);
      if (i < parts.length-1) { const sep = document.createElement('span'); sep.className = 'bc-sep'; sep.textContent = '/'; bc.appendChild(sep); }
    });
  }

  function updateSidebar() {
    document.querySelectorAll('.sb-item').forEach(item => {
      item.classList.toggle('active', item.dataset.path === currentPath);
    });
  }

  function showCtxMenu(e, name, info) {
    ctxMenu.style.left = e.clientX + 'px';
    ctxMenu.style.top  = e.clientY + 'px';
    ctxMenu.classList.add('show');
  }

  document.querySelectorAll('.sb-item').forEach(item => {
    item.addEventListener('click', () => navigate(item.dataset.path));
  });

  document.getElementById('btn-back').addEventListener('click', () => {
    if (histIdx > 0) { histIdx--; currentPath = history[histIdx]; renderCurrent(); }
    document.getElementById('btn-back').disabled = histIdx === 0;
    document.getElementById('btn-fwd').disabled = false;
  });
  document.getElementById('btn-fwd').addEventListener('click', () => {
    if (histIdx < history.length-1) { histIdx++; currentPath = history[histIdx]; renderCurrent(); }
    document.getElementById('btn-fwd').disabled = histIdx === history.length-1;
    document.getElementById('btn-back').disabled = false;
  });
  document.getElementById('btn-up').addEventListener('click', () => {
    const parent = currentPath.split('/').slice(0,-1).join('/') || '/';
    navigate(parent);
  });

  document.getElementById('btn-grid').addEventListener('click', () => { viewMode='grid'; document.getElementById('btn-grid').classList.add('active'); document.getElementById('btn-list').classList.remove('active'); renderCurrent(); });
  document.getElementById('btn-list').addEventListener('click', () => { viewMode='list'; document.getElementById('btn-list').classList.add('active'); document.getElementById('btn-grid').classList.remove('active'); renderCurrent(); });

  document.addEventListener('click', () => ctxMenu.classList.remove('show'));
  document.addEventListener('contextmenu', e => { e.preventDefault(); });
  contentEl.addEventListener('contextmenu', e => { e.preventDefault(); showCtxMenu(e, '', {}); });

  renderCurrent();
})();
</script>
</body>
</html>
