<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Learn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0d1117;
    color: #c9d1d9;
    font-family: 'Inter', sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  canvas#bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }

  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 480px;
    padding: 2rem 1.5rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2rem;
  }

  .brand {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.75rem;
    text-align: center;
  }

  .brand-icon {
    width: 52px;
    height: 52px;
    background: linear-gradient(135deg, #1f6feb, #388bfd);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 32px rgba(56,139,253,0.35);
  }

  .brand h1 {
    font-size: 1.75rem;
    font-weight: 700;
    color: #e6edf3;
    letter-spacing: -0.04em;
  }

  .brand p {
    font-size: 0.82rem;
    color: #8b949e;
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.04em;
  }

  .form-container {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .input-wrapper {
    position: relative;
  }

  input[type="text"] {
    width: 100%;
    background: #161b22;
    border: 1px solid #30363d;
    color: #e6edf3;
    font-family: 'Inter', sans-serif;
    font-size: 0.95rem;
    padding: 0.85rem 3.5rem 0.85rem 1.1rem;
    border-radius: 10px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  input[type="text"]::placeholder { color: #484f58; }

  input[type="text"]:focus {
    border-color: #388bfd;
    box-shadow: 0 0 0 3px rgba(56,139,253,0.15);
  }

  .submit-btn {
    position: absolute;
    right: 0.5rem;
    top: 50%;
    transform: translateY(-50%);
    background: #1f6feb;
    border: none;
    border-radius: 7px;
    width: 34px;
    height: 34px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    transition: background 0.2s, transform 0.15s;
  }

  .submit-btn:hover { background: #388bfd; transform: translateY(-50%) scale(1.05); }
  .submit-btn:active { transform: translateY(-50%) scale(0.97); }
  .submit-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .suggestions-label {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: #484f58;
    font-family: 'JetBrains Mono', monospace;
    align-self: flex-start;
  }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    width: 100%;
  }

  .chip {
    background: #161b22;
    border: 1px solid #30363d;
    color: #8b949e;
    font-size: 0.75rem;
    padding: 0.3rem 0.7rem;
    border-radius: 100px;
    cursor: pointer;
    transition: all 0.15s;
    font-family: 'JetBrains Mono', monospace;
  }

  .chip:hover {
    border-color: #388bfd;
    color: #388bfd;
    background: rgba(56,139,253,0.08);
  }

  .loading-state {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 0.75rem;
  }

  .loading-state.active { display: flex; }
  .form-container.loading { display: none; }

  .spinner {
    width: 32px;
    height: 32px;
    border: 3px solid #30363d;
    border-top-color: #388bfd;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .loading-text {
    font-size: 0.82rem;
    color: #8b949e;
    font-family: 'JetBrains Mono', monospace;
    animation: pulse 1.5s ease-in-out infinite;
  }

  @keyframes pulse { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }

  .footer {
    font-size: 0.65rem;
    color: #484f58;
    font-family: 'JetBrains Mono', monospace;
    text-align: center;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .container > * { animation: fadeUp 0.5s cubic-bezier(0.23,1,0.32,1) both; }
  .container > *:nth-child(1) { animation-delay: 0.05s; }
  .container > *:nth-child(2) { animation-delay: 0.15s; }
  .container > *:nth-child(3) { animation-delay: 0.25s; }
</style>
</head>
<body>
<canvas id="bg"></canvas>

<div class="container">
  <div class="brand">
    <div class="brand-icon">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
        <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
      </svg>
    </div>
    <h1>Learn</h1>
    <p>generative recursive education</p>
  </div>

  <div class="form-container" id="formContainer">
    <div class="input-wrapper">
      <input type="text" id="topicInput" placeholder="Enter a topic to explore…" autocomplete="off" />
      <button class="submit-btn" id="submitBtn" title="Generate lesson">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </button>
    </div>

    <span class="suggestions-label">Suggested topics</span>
    <div class="chips" id="chips">
      <span class="chip">Quantum Entanglement</span>
      <span class="chip">French Revolution</span>
      <span class="chip">React Hooks</span>
      <span class="chip">Black Holes</span>
      <span class="chip">Machine Learning</span>
      <span class="chip">Fourier Transform</span>
      <span class="chip">Byzantine Empire</span>
      <span class="chip">DNA Replication</span>
    </div>
  </div>

  <div class="loading-state" id="loadingState">
    <div class="spinner"></div>
    <span class="loading-text" id="loadingText">Generating your lesson…</span>
  </div>

  <div class="footer">Powered by Gemini · Generative OS</div>
</div>

<script>
  // Canvas ambient background
  (function() {
    const canvas = document.getElementById('bg');
    const ctx = canvas.getContext('2d');
    let W, H, particles = [];

    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    for (let i = 0; i < 60; i++) {
      particles.push({
        x: Math.random() * 1000, y: Math.random() * 1000,
        vx: (Math.random() - 0.5) * 0.2, vy: (Math.random() - 0.5) * 0.2,
        r: Math.random() * 1.5 + 0.5,
        a: Math.random()
      });
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);
      particles.forEach(p => {
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0) p.x = W; if (p.x > W) p.x = 0;
        if (p.y < 0) p.y = H; if (p.y > H) p.y = 0;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(56,139,253,${p.a * 0.4})`;
        ctx.fill();
      });
      requestAnimationFrame(draw);
    }
    draw();
  })();

  // Form logic
  const input = document.getElementById('topicInput');
  const btn = document.getElementById('submitBtn');
  const formContainer = document.getElementById('formContainer');
  const loadingState = document.getElementById('loadingState');
  const loadingText = document.getElementById('loadingText');

  function submit() {
    const topic = input.value.trim();
    if (!topic) return;

    // Switch to loading UI
    formContainer.classList.add('loading');
    loadingState.classList.add('active');
    loadingText.textContent = `Generating lesson on "${topic}"…`;

    // Notify parent OS
    window.parent.postMessage({ type: 'LEARN_TOPIC_SUBMIT', topic }, '*');
  }

  btn.addEventListener('click', submit);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });

  // Chip click — fill input
  document.getElementById('chips').addEventListener('click', e => {
    const chip = e.target.closest('.chip');
    if (chip) { input.value = chip.textContent; input.focus(); }
  });

  // Listen for errors from parent (to reset loading state)
  window.addEventListener('message', e => {
    if (e.data && e.data.type === 'LEARN_ERROR') {
      formContainer.classList.remove('loading');
      loadingState.classList.remove('active');
      input.value = '';
    }
  });
</script>
</body>
</html>
