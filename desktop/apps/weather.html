<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Weather</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0d1117; color: #c9d1d9; font-family: 'Inter', sans-serif; font-size: 13px; height: 100vh; display: flex; flex-direction: column; overflow: hidden; position: relative; }

  canvas#bg { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
  #ui { position: relative; z-index: 1; display: flex; flex-direction: column; height: 100%; overflow-y: auto; }
  #ui::-webkit-scrollbar { width: 4px; }
  #ui::-webkit-scrollbar-thumb { background: #30363d; }

  /* HEADER */
  #header { padding: 1rem 1.25rem 0.75rem; display: flex; align-items: flex-start; justify-content: space-between; }
  .location { display: flex; align-items: center; gap: 0.4rem; }
  .city-name { font-size: 1rem; font-weight: 600; color: #e6edf3; }
  .search-btn { background: none; border: none; color: #636e7b; cursor: pointer; padding: 0.3rem; border-radius: 6px; transition: all 0.15s; }
  .search-btn:hover { background: #21262d; color: #c9d1d9; }
  .last-updated { font-size: 11px; color: #484f58; }

  /* CURRENT */
  #current { padding: 0.5rem 1.25rem 1rem; display: flex; align-items: center; gap: 1rem; }
  #weather-icon-area { flex-shrink: 0; }
  .main-temp { font-size: 4rem; font-weight: 200; color: #e6edf3; letter-spacing: -0.04em; line-height: 1; }
  .main-unit { font-size: 1.5rem; vertical-align: super; color: #636e7b; }
  .condition { font-size: 13px; color: #8b949e; margin-top: 4px; }
  .feels-like { font-size: 12px; color: #636e7b; margin-top: 2px; }
  .temp-range { font-size: 12px; color: #636e7b; }

  /* HOURLY */
  #hourly-scroll { overflow-x: auto; padding: 0 1.25rem 0.75rem; scrollbar-width: none; }
  #hourly-scroll::-webkit-scrollbar { display: none; }
  #hourly-row { display: flex; gap: 0.5rem; min-width: max-content; }
  .hour-card {
    background: rgba(22,27,34,0.8); border: 1px solid #21262d; border-radius: 10px;
    padding: 0.6rem 0.75rem; display: flex; flex-direction: column; align-items: center; gap: 0.35rem;
    backdrop-filter: blur(8px); min-width: 64px;
  }
  .hour-card.now { border-color: #388bfd55; background: rgba(56,139,253,0.1); }
  .hour-time { font-size: 11px; color: #636e7b; }
  .hour-temp { font-size: 14px; font-weight: 500; color: #e6edf3; }
  .hour-icon { font-size: 18px; }
  .precip-chance { font-size: 10px; color: #539bf5; }

  /* DETAILS */
  #details { padding: 0 1.25rem 0.75rem; display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.5rem; }
  .detail-card {
    background: rgba(22,27,34,0.8); border: 1px solid #21262d; border-radius: 10px;
    padding: 0.75rem; backdrop-filter: blur(8px);
  }
  .detail-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: #484f58; margin-bottom: 0.35rem; }
  .detail-value { font-size: 1.1rem; font-weight: 600; color: #e6edf3; }
  .detail-sub { font-size: 11px; color: #636e7b; margin-top: 2px; }

  /* 7-DAY */
  #forecast { padding: 0 1.25rem 1rem; }
  .forecast-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: #484f58; margin-bottom: 0.5rem; }
  .forecast-row {
    display: flex; align-items: center; gap: 0.75rem; padding: 0.5rem 0;
    border-bottom: 1px solid #161b22;
  }
  .forecast-row:last-child { border-bottom: none; }
  .fc-day { font-size: 12.5px; color: #8b949e; width: 64px; }
  .fc-icon { font-size: 18px; width: 28px; text-align: center; }
  .fc-bar-area { flex: 1; display: flex; align-items: center; gap: 0.5rem; }
  .fc-low { font-size: 12px; color: #636e7b; width: 28px; text-align: right; }
  .fc-bar-wrap { flex: 1; height: 4px; background: #21262d; border-radius: 2px; }
  .fc-bar { height: 100%; border-radius: 2px; background: linear-gradient(to right, #539bf5, #e3b341); }
  .fc-high { font-size: 12px; color: #e6edf3; font-weight: 500; width: 28px; }

  /* UV INDEX BAR */
  .uv-bar { width: 100%; height: 4px; border-radius: 2px; background: linear-gradient(to right, #57ab5a, #e3b341, #f47067); margin-top: 6px; position: relative; }
  .uv-dot { position: absolute; top: -3px; width: 10px; height: 10px; background: #fff; border-radius: 50%; transform: translateX(-50%); }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="ui">
  <div id="header">
    <div class="location">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#388bfd" stroke-width="2" stroke-linecap="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
      <span class="city-name">San Francisco, CA</span>
      <button class="search-btn" title="Search location">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </button>
    </div>
    <span class="last-updated">Updated 2 min ago</span>
  </div>

  <div id="current">
    <div id="weather-icon-area">
      <canvas id="icon-canvas" width="90" height="90"></canvas>
    </div>
    <div>
      <div class="main-temp">18<span class="main-unit">°C</span></div>
      <div class="condition">Partly Cloudy</div>
      <div class="feels-like">Feels like 16°C</div>
      <div class="temp-range">H: 22°  L: 13°</div>
    </div>
  </div>

  <div id="hourly-scroll">
    <div id="hourly-row"></div>
  </div>

  <div id="details">
    <div class="detail-card">
      <div class="detail-label">Humidity</div>
      <div class="detail-value">72<span style="font-size:0.75rem">%</span></div>
      <div class="detail-sub">Dew pt. 12°C</div>
    </div>
    <div class="detail-card">
      <div class="detail-label">Wind</div>
      <div class="detail-value">14<span style="font-size:0.75rem"> km/h</span></div>
      <div class="detail-sub">NW — Gusty</div>
    </div>
    <div class="detail-card">
      <div class="detail-label">Visibility</div>
      <div class="detail-value">10<span style="font-size:0.75rem"> km</span></div>
      <div class="detail-sub">Clear</div>
    </div>
    <div class="detail-card">
      <div class="detail-label">Pressure</div>
      <div class="detail-value">1013<span style="font-size:0.75rem"> hPa</span></div>
      <div class="detail-sub">Steady</div>
    </div>
    <div class="detail-card">
      <div class="detail-label">UV Index</div>
      <div class="detail-value">6 <span style="font-size:0.75rem;color:#e3b341">High</span></div>
      <div class="uv-bar"><div class="uv-dot" style="left:50%"></div></div>
    </div>
    <div class="detail-card">
      <div class="detail-label">Precipitation</div>
      <div class="detail-value">4<span style="font-size:0.75rem"> mm</span></div>
      <div class="detail-sub">Last 24h</div>
    </div>
    <div class="detail-card">
      <div class="detail-label">Sunrise</div>
      <div class="detail-value" style="font-size:0.9rem">6:12 AM</div>
      <div class="detail-sub">Sunset 7:48 PM</div>
    </div>
    <div class="detail-card">
      <div class="detail-label">Air Quality</div>
      <div class="detail-value" style="color:#57ab5a">Good</div>
      <div class="detail-sub">AQI 32</div>
    </div>
  </div>

  <div id="forecast">
    <div class="forecast-title">7-Day Forecast</div>
    <div id="forecast-rows"></div>
  </div>
</div>

<script>
(function() {
  // Animated sky background
  const canvas = document.getElementById('bg');
  const ctx2 = canvas.getContext('2d');
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });
  let stars = Array.from({length:80}, () => ({ x: Math.random()*1000, y: Math.random()*800, r: Math.random()*1.2+0.2, a: Math.random() }));
  let t = 0;
  function drawBg() {
    t += 0.003;
    const W = canvas.width, H = canvas.height;
    ctx2.clearRect(0,0,W,H);
    // gradient sky
    const grad = ctx2.createLinearGradient(0,0,0,H);
    grad.addColorStop(0, '#0a0e1a');
    grad.addColorStop(0.4, '#0d1117');
    grad.addColorStop(1, '#0d1117');
    ctx2.fillStyle = grad;
    ctx2.fillRect(0,0,W,H);
    // aurora-like glow
    const a1 = ctx2.createRadialGradient(W*0.3, H*0.2, 0, W*0.3, H*0.2, W*0.4);
    a1.addColorStop(0, 'rgba(56,139,253,0.06)');
    a1.addColorStop(1, 'transparent');
    ctx2.fillStyle = a1; ctx2.fillRect(0,0,W,H);
    // stars
    stars.forEach(s => {
      const flicker = 0.5 + 0.5 * Math.sin(t * (s.r * 3 + 1) + s.x);
      ctx2.beginPath();
      ctx2.arc(s.x % W, s.y % H, s.r, 0, Math.PI*2);
      ctx2.fillStyle = `rgba(200,210,230,${s.a * flicker * 0.4})`;
      ctx2.fill();
    });
    requestAnimationFrame(drawBg);
  }
  drawBg();

  // Weather icon (canvas-drawn sun/cloud)
  const ic = document.getElementById('icon-canvas').getContext('2d');
  let iconT = 0;
  function drawIcon() {
    iconT += 0.03;
    ic.clearRect(0,0,90,90);
    // Sun (slightly pulsing glow)
    const pulse = 1 + 0.05 * Math.sin(iconT);
    const sunGrad = ic.createRadialGradient(30,30,0,30,30,25*pulse);
    sunGrad.addColorStop(0,'#e3b341'); sunGrad.addColorStop(0.5,'#e3b34199'); sunGrad.addColorStop(1,'transparent');
    ic.fillStyle = sunGrad; ic.beginPath(); ic.arc(30,30,28,0,Math.PI*2); ic.fill();
    ic.fillStyle = '#e3b341'; ic.beginPath(); ic.arc(30,30,18,0,Math.PI*2); ic.fill();
    // Cloud
    ic.fillStyle = 'rgba(200,210,230,0.9)';
    ic.beginPath();
    ic.arc(50,52,16,Math.PI,0); ic.arc(62,48,10,Math.PI,0); ic.arc(42,50,12,Math.PI,0);
    ic.closePath(); ic.fill();
    requestAnimationFrame(drawIcon);
  }
  drawIcon();

  // Hourly data
  const ICONS_H = ['☀️','⛅','🌤️','🌦️','⛅','🌤️','☀️','🌙','🌙','🌙','🌙','🌙'];
  const now = new Date().getHours();
  const TEMPS = [16,16,17,18,20,22,21,19,17,15,14,13];
  const PREC = [0,0,5,10,0,0,0,0,10,5,0,0];
  const row = document.getElementById('hourly-row');
  for (let i = 0; i < 12; i++) {
    const h = (now + i) % 24;
    const label = i === 0 ? 'Now' : (h > 12 ? `${h-12} PM` : (h === 12 ? '12 PM' : (h === 0 ? '12 AM' : `${h} AM`)));
    const div = document.createElement('div');
    div.className = 'hour-card' + (i === 0 ? ' now' : '');
    div.innerHTML = `<div class="hour-time">${label}</div><div class="hour-icon">${ICONS_H[i]}</div><div class="hour-temp">${TEMPS[i]}°</div>${PREC[i] > 0 ? `<div class="precip-chance">${PREC[i]}%💧</div>` : '<div class="precip-chance" style="opacity:0">0</div>'}`;
    row.appendChild(div);
  }

  // 7-day forecast
  const DAYS7 = ['Today','Tomorrow','Wednesday','Thursday','Friday','Saturday','Sunday'];
  const ICONS7 = ['⛅','🌤️','☀️','🌦️','⛅','☀️','🌤️'];
  const LOWS  = [13,12,14,11,10,15,13];
  const HIGHS = [22,24,26,18,16,28,23];
  const fRows = document.getElementById('forecast-rows');
  const minL = Math.min(...LOWS), maxH = Math.max(...HIGHS);
  DAYS7.forEach((day,i) => {
    const div = document.createElement('div');
    div.className = 'forecast-row';
    const barLeft = ((LOWS[i]-minL)/(maxH-minL)*100).toFixed(1);
    const barW = ((HIGHS[i]-LOWS[i])/(maxH-minL)*100).toFixed(1);
    div.innerHTML = `<div class="fc-day">${day}</div><div class="fc-icon">${ICONS7[i]}</div><div class="fc-bar-area"><div class="fc-low">${LOWS[i]}°</div><div class="fc-bar-wrap"><div class="fc-bar" style="margin-left:${barLeft}%;width:${barW}%"></div></div><div class="fc-high">${HIGHS[i]}°</div></div>`;
    fRows.appendChild(div);
  });
})();
</script>
</body>
</html>
