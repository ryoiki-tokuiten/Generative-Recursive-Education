<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Notes</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0d1117; color: #c9d1d9; font-family: 'Inter', sans-serif; font-size: 13px; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  /* TOOLBAR */
  #toolbar {
    display: flex; align-items: center; gap: 0.4rem;
    padding: 0.5rem 0.75rem; border-bottom: 1px solid #21262d;
    background: #161b22; flex-shrink: 0;
  }
  .tool-btn {
    background: none; border: none; color: #8b949e; cursor: pointer;
    font-size: 12px; font-weight: 600; padding: 0.25rem 0.45rem;
    border-radius: 4px; transition: background 0.15s, color 0.15s;
    font-family: 'JetBrains Mono', monospace;
  }
  .tool-btn:hover { background: #21262d; color: #e6edf3; }
  .tool-btn.active { background: #388bfd22; color: #388bfd; }
  .tool-sep { width: 1px; height: 18px; background: #30363d; margin: 0 0.25rem; }
  .tool-spacer { flex: 1; }
  .word-count { font-size: 11px; color: #484f58; font-family: 'JetBrains Mono', monospace; }

  /* LAYOUT */
  #main { flex: 1; display: flex; overflow: hidden; }

  /* SIDEBAR */
  #sidebar {
    width: 220px; flex-shrink: 0; border-right: 1px solid #21262d;
    display: flex; flex-direction: column; background: #0d1117;
  }
  #sidebar-header {
    padding: 0.75rem; border-bottom: 1px solid #21262d; display: flex; gap: 0.4rem;
  }
  #search-input {
    flex: 1; background: #161b22; border: 1px solid #30363d; color: #c9d1d9;
    border-radius: 6px; padding: 0.3rem 0.6rem; font-size: 12px; font-family: inherit; outline: none;
    transition: border-color 0.2s;
  }
  #search-input:focus { border-color: #388bfd; }
  #search-input::placeholder { color: #484f58; }
  .new-note-btn {
    background: #1f6feb; border: none; color: #fff; border-radius: 6px;
    width: 26px; height: 26px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: background 0.15s; font-size: 16px; flex-shrink: 0;
  }
  .new-note-btn:hover { background: #388bfd; }

  #note-list { flex: 1; overflow-y: auto; }
  #note-list::-webkit-scrollbar { width: 3px; }
  #note-list::-webkit-scrollbar-thumb { background: #30363d; }

  .note-item {
    padding: 0.65rem 0.75rem; border-bottom: 1px solid #161b22;
    cursor: pointer; transition: background 0.12s; position: relative;
  }
  .note-item:hover { background: #161b22; }
  .note-item.active { background: #1c2128; border-left: 2px solid #388bfd; }
  .note-name { font-size: 12.5px; color: #e6edf3; font-weight: 500; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .note-preview { font-size: 11px; color: #636e7b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .note-date { font-size: 10px; color: #484f58; margin-top: 4px; font-family: 'JetBrains Mono', monospace; }

  .sidebar-section { padding: 0.4rem 0.75rem 0.2rem; font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: #484f58; }

  /* EDITOR */
  #editor-pane { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  #note-title-input {
    background: transparent; border: none; color: #e6edf3; font-size: 1.4rem; font-weight: 700;
    font-family: inherit; padding: 1.25rem 1.5rem 0.5rem; outline: none; width: 100%;
    letter-spacing: -0.02em;
  }
  #note-title-input::placeholder { color: #30363d; }

  #note-meta {
    padding: 0 1.5rem 0.75rem; font-size: 11px; color: #484f58;
    display: flex; gap: 1rem; border-bottom: 1px solid #21262d;
    font-family: 'JetBrains Mono', monospace;
  }

  #editor {
    flex: 1; overflow-y: auto; padding: 1.25rem 1.5rem;
    outline: none; line-height: 1.8; color: #c9d1d9; font-size: 13.5px;
    caret-color: #388bfd;
  }
  #editor::-webkit-scrollbar { width: 4px; }
  #editor::-webkit-scrollbar-thumb { background: #30363d; }
  #editor::placeholder { color: #30363d; }

  #editor h1,h2,h3 { color: #e6edf3; }
  #editor code { font-family: 'JetBrains Mono', monospace; background: #161b22; padding: 1px 5px; border-radius: 4px; font-size: 12px; color: #96d0ff; }

  .tag { display: inline-block; background: #1f6feb22; color: #388bfd; border: 1px solid #1f6feb44; border-radius: 100px; font-size: 10px; padding: 1px 7px; margin-right: 4px; }
</style>
</head>
<body>

<div id="toolbar">
  <button class="tool-btn" title="Bold" onclick="fmt('bold')"><b>B</b></button>
  <button class="tool-btn" title="Italic" onclick="fmt('italic')"><i>I</i></button>
  <button class="tool-btn" title="Underline" onclick="fmt('underline')"><u>U</u></button>
  <div class="tool-sep"></div>
  <button class="tool-btn" title="Heading 1" onclick="fmt('h1')">H1</button>
  <button class="tool-btn" title="Heading 2" onclick="fmt('h2')">H2</button>
  <div class="tool-sep"></div>
  <button class="tool-btn" title="Bullet list" onclick="fmt('list')">• List</button>
  <button class="tool-btn" title="Code block" onclick="fmt('code')">{ }</button>
  <button class="tool-btn" title="Blockquote" onclick="fmt('quote')">" Quote</button>
  <div class="tool-sep"></div>
  <button class="tool-btn" title="Insert link" onclick="fmt('link')">Link</button>
  <div class="tool-spacer"></div>
  <span class="word-count" id="word-count">0 words</span>
</div>

<div id="main">
  <div id="sidebar">
    <div id="sidebar-header">
      <input type="text" id="search-input" placeholder="Search notes…" />
      <button class="new-note-btn" title="New note" onclick="newNote()">+</button>
    </div>
    <div class="sidebar-section">Pinned</div>
    <div id="note-list"></div>
  </div>

  <div id="editor-pane">
    <input type="text" id="note-title-input" placeholder="Note title…" />
    <div id="note-meta">
      <span id="meta-date">—</span>
      <span id="meta-tags"><span class="tag">ideas</span><span class="tag">work</span></span>
    </div>
    <div id="editor" contenteditable="true" spellcheck="false"></div>
  </div>
</div>

<script>
(function() {
  const NOTES = [
    {
      id: 1, title: 'Project Ideas 2026', pinned: true,
      date: 'Apr 20, 2026', tags: ['ideas','projects'],
      body: '<h2>Active Projects</h2><p>Working on <strong>Generative OS</strong> — a recursive AI-powered desktop environment. Each application generates its next state from user interaction.</p><br><h2>Next Steps</h2><ul><li>Build the window management system</li><li>Implement the OS AI agent</li><li>Write initial app HTML files</li><li>Test the full pipeline end-to-end</li></ul><br><h2>Future Ideas</h2><p>Generative <code>code editor</code> — AI writes the next file based on what you\'re working on. Pair programmer that lives inside the OS.</p>'
    },
    {
      id: 2, title: 'Meeting Notes — Q2 Planning', pinned: true,
      date: 'Apr 18, 2026', tags: ['meetings','work'],
      body: '<h2>Attendees</h2><p>Design team, Engineering leads, PM team</p><br><h2>Key Decisions</h2><ul><li>Ship v1.0 by end of May</li><li>Focus on core app stability over feature breadth</li><li>Weekly syncs every Tuesday 10am</li></ul><br><h2>Action Items</h2><ul><li><strong>Alice</strong> — Finalize design system tokens</li><li><strong>Bob</strong> — Set up CI/CD pipeline</li><li><strong>Me</strong> — Complete the generative pipeline architecture</li></ul>'
    },
    {
      id: 3, title: 'Reading List', pinned: false,
      date: 'Apr 15, 2026', tags: ['reading'],
      body: '<h2>Books</h2><ul><li>The Pragmatic Programmer — Hunt &amp; Thomas</li><li>Gödel, Escher, Bach — Hofstadter</li><li>The Art of Doing Science and Engineering — Hamming</li><li>Thinking in Systems — Meadows</li></ul><br><h2>Papers</h2><ul><li>Attention Is All You Need (Vaswani et al.)</li><li>Constitutional AI — Anthropic</li><li>Chain-of-Thought Prompting (Wei et al.)</li></ul>'
    },
    {
      id: 4, title: 'Quick Notes', pinned: false,
      date: 'Apr 21, 2026', tags: ['misc'],
      body: '<p>Things to remember:</p><br><ul><li>Update node dependencies</li><li>Review PR #47</li><li>Renew domain subscription</li></ul><br><p><code>npm run build</code> takes ~45s — investigate bundle size.</p>'
    },
    {
      id: 5, title: 'Generative OS Architecture', pinned: false,
      date: 'Apr 19, 2026', tags: ['tech','architecture'],
      body: '<h2>Core Insight</h2><p>Treat each desktop application\'s HTML as the <strong>seed node</strong> in a recursive generative tree. The user\'s interactions are the branching events.</p><br><h2>Agent Routing</h2><ul><li>Learn app → Educational agent (Gemini)</li><li>All other apps → OS UI agent (next-screen generator)</li></ul><br><h2>State Model</h2><p>Each window has an independent <code>NodeMap</code>. Multiple instances of the same app can coexist with separate histories.</p>'
    },
  ];

  let activeId = NOTES[0].id;
  const list = document.getElementById('note-list');
  const titleInput = document.getElementById('note-title-input');
  const editor = document.getElementById('editor');
  const metaDate = document.getElementById('meta-date');
  const metaTags = document.getElementById('meta-tags');
  const wordCountEl = document.getElementById('word-count');
  const searchInput = document.getElementById('search-input');

  function renderList(filter = '') {
    list.innerHTML = '';
    const filtered = NOTES.filter(n => !filter || n.title.toLowerCase().includes(filter) || n.body.toLowerCase().includes(filter));
    filtered.sort((a,b) => b.pinned - a.pinned);
    filtered.forEach(note => {
      const div = document.createElement('div');
      div.className = 'note-item' + (note.id === activeId ? ' active' : '');
      const preview = note.body.replace(/<[^>]+>/g, '').slice(0, 60).trim();
      div.innerHTML = `<div class="note-name">${note.title}</div><div class="note-preview">${preview}…</div><div class="note-date">${note.date}</div>`;
      div.addEventListener('click', () => { activeId = note.id; loadNote(note); renderList(searchInput.value); });
      list.appendChild(div);
    });
  }

  function loadNote(note) {
    titleInput.value = note.title;
    editor.innerHTML = note.body;
    metaDate.textContent = note.date;
    metaTags.innerHTML = note.tags.map(t => `<span class="tag">${t}</span>`).join('');
    updateWordCount();
  }

  function updateWordCount() {
    const text = editor.innerText.trim();
    const words = text ? text.split(/\s+/).length : 0;
    wordCountEl.textContent = `${words} word${words !== 1 ? 's' : ''}`;
  }

  editor.addEventListener('input', () => {
    const active = NOTES.find(n => n.id === activeId);
    if (active) { active.body = editor.innerHTML; updateWordCount(); }
  });

  titleInput.addEventListener('input', () => {
    const active = NOTES.find(n => n.id === activeId);
    if (active) { active.title = titleInput.value; renderList(searchInput.value); }
  });

  searchInput.addEventListener('input', () => renderList(searchInput.value.toLowerCase()));

  window.fmt = function(type) {
    editor.focus();
    const cmds = { bold:'bold', italic:'italic', underline:'underline', h1:'formatBlock', h2:'formatBlock', list:'insertUnorderedList', code:'insertHTML', quote:'formatBlock', link:'createLink' };
    if (type === 'h1') document.execCommand('formatBlock',false,'h1');
    else if (type === 'h2') document.execCommand('formatBlock',false,'h2');
    else if (type === 'quote') document.execCommand('formatBlock',false,'blockquote');
    else if (type === 'code') document.execCommand('insertHTML',false,'<code>code</code>');
    else if (type === 'link') { const u = prompt('Enter URL:'); if(u) document.execCommand('createLink',false,u); }
    else document.execCommand(cmds[type]);
  };

  window.newNote = function() {
    const n = { id: Date.now(), title: 'Untitled Note', date: new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}), tags: [], body: '', pinned: false };
    NOTES.unshift(n);
    activeId = n.id;
    renderList();
    loadNote(n);
    titleInput.focus();
  };

  renderList();
  loadNote(NOTES[0]);
})();
</script>
</body>
</html>
